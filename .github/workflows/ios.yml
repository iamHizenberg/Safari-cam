name: iOS build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project SafariCam.xcodeproj -scheme SafariCam -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload && cp -R "build/Build/Products/Release-iphoneos/Safari cam.app" Payload/
          zip -qr SafariCam.ipa Payload
          ls -la SafariCam.ipa
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ios/SafariCam.ipa --title "Safari cam $TAG" --notes "Sideloadly でインストールしてください"
