<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>Safari cam</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#000; --fg:#fff; --dim:rgba(255,255,255,.65);
    --panel:#141416; --bar:#1c1c1f; --chip:#2a2a2e; --chip2:#444449;
    --glass:rgba(20,20,22,.55); --accent:#f2c6a0; --rec:#ff3b30;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Hiragino Sans",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .hidden{display:none!important}
  .blur{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

  /* ===== 起動画面 ===== */
  #start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;text-align:center}
  .logo{display:flex;align-items:center;gap:18px}
  .logo h1{font-size:30px;margin:0;letter-spacing:.02em;font-weight:600}
  .pin{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#1a1008;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;box-shadow:0 6px 24px rgba(242,198,160,.35)}
  .pin:active{transform:scale(.95)}
  #start p{color:var(--dim);margin:0;max-width:30ch;line-height:1.7;font-size:13px}
  #startErr{color:#ff6b61}

  /* ===== カメラ（常に最背面で動いている） ===== */
  #cam{position:fixed;inset:0;background:#000}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #video.mirror{transform:scaleX(-1)}
  #grid{position:absolute;inset:0;pointer-events:none}
  #grid i{position:absolute;background:rgba(255,255,255,.35)}
  #grid i:nth-child(1){left:33.33%;top:0;bottom:0;width:1px}
  #grid i:nth-child(2){left:66.66%;top:0;bottom:0;width:1px}
  #grid i:nth-child(3){top:33.33%;left:0;right:0;height:1px}
  #grid i:nth-child(4){top:66.66%;left:0;right:0;height:1px}

  /* 左上のアナウンスマーク（どの画面でも同じ位置） */
  .mark{position:fixed;left:max(12px,var(--sal));top:calc(var(--sat) + 10px);z-index:30;width:40px;height:40px;border-radius:50%;background:var(--glass);display:grid;place-items:center;opacity:.6}
  .mark .ic{font-size:16px}

  .camtop{position:absolute;right:max(12px,var(--sar));top:calc(var(--sat) + 10px);display:flex;gap:8px}
  .ico{width:40px;height:40px;border-radius:50%;background:var(--glass);display:grid;place-items:center;font-size:18px}
  .ico.on{background:var(--fg);color:#000}

  .beauty{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 136px);padding:0 max(20px,var(--sar)) 0 max(20px,var(--sal));display:flex;align-items:center;gap:12px}
  .beauty label{font-size:12px;color:var(--dim);width:36px;letter-spacing:.04em}
  .beauty input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
  .beauty input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
  .beauty input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);margin-top:-10.5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .beauty output{font-size:12px;width:28px;text-align:right;font-variant-numeric:tabular-nums}

  .cambot{position:absolute;left:0;right:0;bottom:0;padding:18px max(16px,var(--sar)) calc(var(--sab) + 18px) max(16px,var(--sal));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}
  .thumb{justify-self:start;width:48px;height:48px;border-radius:10px;background:#222;border:1.5px solid rgba(255,255,255,.4);overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--dim)}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
  #shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
  #shutter i{display:block;width:62px;height:62px;border-radius:50%;background:#fff}
  #stopBtn{justify-self:end;height:48px;padding:0 16px;border-radius:14px;background:rgba(255,59,48,.85);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  #stopBtn.idle{background:var(--glass)}

  /* ===== トップ画面（マニュアル） ===== */
  #top{position:fixed;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:20}
  .ttop{padding:calc(var(--sat) + 8px) max(12px,var(--sar)) 8px calc(max(12px,var(--sal)) + 128px);display:flex;align-items:center;gap:8px;background:var(--bar);flex:none;min-height:calc(var(--sat) + 60px)}
  .tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
  .tabs button{padding:7px 12px;border-radius:8px;font-size:13px;color:var(--dim)}
  .tabs button.on{background:var(--chip2);color:#fff}
  .ttop .sp{flex:1}
  .pin.sm{width:40px;height:40px;font-size:10px;box-shadow:none}
    .tbody{flex:1;min-height:0;position:relative;background:#333336}
  #pdfwrap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
  #pdfwrap canvas{display:block;width:100%;margin:0 auto 8px;background:#fff;border-radius:3px}
  #urlwrap,#mapwrap{position:absolute;inset:0;display:flex;flex-direction:column}
  .bar{display:flex;gap:6px;padding:8px max(12px,var(--sar)) 8px max(12px,var(--sal));background:var(--bar)}
  .bar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:0;background:var(--chip);color:#fff}
  .bar button{padding:0 14px;border-radius:10px;background:var(--chip2);font-size:13px}
  iframe{flex:1;border:0;background:#fff;width:100%}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:var(--dim)}
  .empty b{color:#fff;font-size:17px}
  .big{padding:14px 22px;border-radius:14px;background:var(--accent);color:#1a1008;font-weight:600;font-size:15px}
  .note{font-size:12px;line-height:1.6;max-width:30ch}
  .tbot{flex:none;padding:10px max(16px,var(--sar)) calc(var(--sab) + 10px) max(16px,var(--sal));background:var(--bar);display:flex;gap:10px;align-items:center;justify-content:space-between}
  .sub{height:44px;padding:0 16px;border-radius:14px;background:var(--chip);font-size:13px}

  /* ===== 確認 ===== */
  #rev{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:40}
  #rev .media{flex:1;min-height:0;display:grid;place-items:center}
  #rev img,#rev video{max-width:100%;max-height:100%}
  #toast{position:fixed;left:50%;bottom:calc(var(--sab) + 110px);transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:88vw;text-align:center;z-index:50}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 起動画面：pin を押すと裏でカメラ起動＋録画開始 -->
<div id="start">
  <div class="logo">
    <h1>Safari cam</h1>
    <button class="pin" id="startPin">pin</button>
  </div>
  <p id="startErr" class="note"></p>
</div>

<!-- 左上アナウンスマーク -->
<button class="mark hidden" id="mark"><span class="ic">📢</span></button>

<!-- カメラ画面（常に動作、トップ画面の裏にいる） -->
<div id="cam" class="hidden">
  <video id="video" autoplay muted playsinline></video>
  <div id="grid"><i></i><i></i><i></i><i></i></div>
  <div class="camtop">
    <button class="ico on" id="gridBtn" title="グリッド">⊞</button>
    <button class="ico" id="flipBtn" title="カメラ切替">⟲</button>
  </div>
  <div class="beauty">
    <label>美白</label>
    <input type="range" id="beauty" min="0" max="100" value="35">
    <output id="beautyVal">35</output>
  </div>
  <div class="cambot">
    <button class="thumb" id="thumb">—</button>
    <button id="shutter" title="写真を撮る"><i></i></button>
    <button id="stopBtn">■ 録画停止</button>
  </div>
</div>

<!-- トップ画面：マニュアル -->
<div id="top" class="hidden">
  <div class="ttop">
    <div class="tabs">
      <button data-tab="pdf" class="on">PDF</button>
      <button data-tab="url">URL</button>
      <button data-tab="map">地図</button>
    </div>
    <span class="sp"></span>
    <button class="pin sm" id="topPin" title="録画 開始/停止">pin</button>
  </div>
  <div class="tbody">
    <div id="pdfwrap">
      <div class="empty" id="pdfEmpty">
        <button class="big" id="pickPdf">PDFを選ぶ</button>
      </div>
    </div>
    <div id="urlwrap" class="hidden">
      <div class="bar">
        <input id="urlIn" type="url" placeholder="検索 または URL" inputmode="search" autocapitalize="off" autocorrect="off">
        <button id="urlGo">開く</button>
      </div>
      <iframe id="frame" title="manual" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
    <div id="mapwrap" class="hidden">
      <div class="bar">
        <input id="mapIn" type="text" placeholder="住所・店名・Googleマップのリンク" autocapitalize="off" autocorrect="off">
        <button id="mapGo">表示</button>
      </div>
      <iframe id="map" title="map" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
  <div class="tbot">
    <button class="sub" id="pickPdf2">別のPDF</button>
    <button class="sub" id="thumb2">最後の撮影を見る</button>
  </div>
</div>
<input type="file" id="pdfFile" accept="application/pdf" class="hidden">

<!-- 確認画面 -->
<div id="rev" class="hidden">
  <div class="media" id="revMedia"></div>
  <div class="tbot">
    <button class="sub" id="revClose">閉じる</button>
    <button class="big" id="revSave">保存 / 共有</button>
  </div>
</div>

<div id="toast"></div>
<canvas id="work" class="hidden"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const video = $('#video'), work = $('#work');
  const toast = (m, t = 2200) => { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), t); };

  let stream = null, facing = 'environment';
  let rec = null, chunks = [], recStart = 0, recTimer = null, recording = false;
  let drawLoop = null, canvasStream = null;
  let lastBlob = null, thumbUrl = null;
  let beauty = 35;
  let showingCam = false;

  // ---------- 美白 ----------
  const filterFor = v => { const b = 1 + v * 0.0035, c = 1 - v * 0.0012, s = 1 - v * 0.0018; return `brightness(${b.toFixed(3)}) contrast(${c.toFixed(3)}) saturate(${s.toFixed(3)})`; };
  const applyPreview = () => { video.style.filter = filterFor(beauty); };
  $('#beauty').addEventListener('input', e => { beauty = +e.target.value; $('#beautyVal').value = beauty; applyPreview(); try { localStorage.setItem('beauty', beauty); } catch {} });
  try { const b = localStorage.getItem('beauty'); if (b !== null) { beauty = +b; $('#beauty').value = beauty; $('#beautyVal').value = beauty; } } catch {}

  // ---------- カメラ ----------
  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    await video.play();
    applyPreview();
  }
  let lock = null;
  async function wakeLock() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock(); if (stream && !stream.active) startCamera().catch(() => {}); } });

  // ---------- 画面切替 ----------
  const showTop = () => { showingCam = false; $('#top').classList.remove('hidden'); $('#mark').querySelector('.ic').textContent = '📢'; };
  const showCam = () => { showingCam = true; $('#top').classList.add('hidden'); $('#mark').querySelector('.ic').textContent = '📄'; };
  $('#mark').addEventListener('click', () => showingCam ? showTop() : showCam());

  // ---------- pin：起動 → 録画開始 → トップ画面 ----------
  $('#startPin').addEventListener('click', async () => {
    try {
      await startCamera();
    } catch (e) { $('#startErr').textContent = 'カメラを起動できません: ' + (e.message || e) + '（Safariの設定でカメラとマイクを許可してください）'; return; }
    $('#start').classList.add('hidden'); $('#cam').classList.remove('hidden'); $('#mark').classList.remove('hidden');
    wakeLock(); showTop();
    // 映像サイズが取れてから録画開始
    const go = () => { if (video.videoWidth) startRec(); else setTimeout(go, 100); }; go();
  });
  $('#topPin').addEventListener('click', () => recording ? stopRec() : startRec());
  $('#stopBtn').addEventListener('click', () => recording ? stopRec() : startRec());
  $('#flipBtn').addEventListener('click', async () => { if (recording) return toast('録画中は切り替えできません'); facing = facing === 'user' ? 'environment' : 'user'; try { await startCamera(); } catch { toast('切り替え失敗'); } });
  $('#gridBtn').addEventListener('click', e => { $('#grid').classList.toggle('hidden'); e.currentTarget.classList.toggle('on'); });

  // ---------- 写真（録画中でも撮れる） ----------
  function takePhoto() {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w) return toast('カメラ準備中…');
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.save(); if (facing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
    if ('filter' in ctx) ctx.filter = filterFor(beauty);
    ctx.drawImage(video, 0, 0, w, h); ctx.restore();
    if (!('filter' in ctx)) whitenPixels(ctx, w, h);
    flash();
    c.toBlob(b => { setLast(b); void 0; }, 'image/jpeg', 0.92);
  }
  function whitenPixels(ctx, w, h) { if (!beauty) return; const img = ctx.getImageData(0, 0, w, h), d = img.data, k = beauty / 100; for (let i = 0; i < d.length; i += 4) for (let c = 0; c < 3; c++) { const v = d[i + c]; d[i + c] = v + (255 - v) * 0.35 * k; } ctx.putImageData(img, 0, 0); }
  function flash() { const f = document.createElement('div'); f.style.cssText = 'position:fixed;inset:0;background:#fff;opacity:.8;pointer-events:none;transition:opacity .25s;z-index:60'; document.body.appendChild(f); requestAnimationFrame(() => { f.style.opacity = 0; setTimeout(() => f.remove(), 300); }); }
  $('#shutter').addEventListener('click', takePhoto);

  // ---------- 動画 ----------
  const pickMime = () => ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  function startRec() {
    if (recording) return;
    if (!window.MediaRecorder) return toast('このブラウザは録画に未対応です');
    const w = video.videoWidth, h = video.videoHeight;
    let src = stream, baked = false;
    const ctx = work.getContext('2d');
    if (w && 'filter' in ctx && work.captureStream) {
      work.width = w; work.height = h;
      canvasStream = work.captureStream(30);
      stream.getAudioTracks().forEach(t => canvasStream.addTrack(t));
      const draw = () => { ctx.save(); if (facing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); } ctx.filter = filterFor(beauty); ctx.drawImage(video, 0, 0, w, h); ctx.restore(); drawLoop = requestAnimationFrame(draw); };
      draw(); src = canvasStream; baked = true;
    }
    const mime = pickMime();
    try { rec = new MediaRecorder(src, mime ? { mimeType: mime, videoBitsPerSecond: 8_000_000 } : undefined); }
    catch (e) { stopDraw(); return toast('録画を開始できません: ' + e.message); }
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => { stopDraw(); setLast(new Blob(chunks, { type: rec.mimeType || mime || 'video/mp4' })); void 0; };
    rec.start(1000);
    recording = true; recStart = Date.now();
    $('#stopBtn').textContent = '■ 録画停止'; $('#stopBtn').classList.remove('idle'); $('#topPin').textContent = 'stop';
  }
  function stopDraw() { if (drawLoop) cancelAnimationFrame(drawLoop); drawLoop = null; if (canvasStream) canvasStream.getVideoTracks().forEach(t => t.stop()); canvasStream = null; }
  function stopRec() {
    if (!rec) return;
    try { rec.stop(); } catch {}
    recording = false;
    $('#stopBtn').textContent = '● 録画開始'; $('#stopBtn').classList.add('idle'); $('#topPin').textContent = 'pin';
  }

  // ---------- サムネ / 確認 / 保存 ----------
  function setLast(blob) {
    lastBlob = blob; if (thumbUrl) URL.revokeObjectURL(thumbUrl); thumbUrl = URL.createObjectURL(blob);
    const t = $('#thumb'); t.innerHTML = '';
    if (blob.type.startsWith('video')) { const v = document.createElement('video'); v.src = thumbUrl; v.muted = true; v.playsInline = true; t.appendChild(v); }
    else { const i = document.createElement('img'); i.src = thumbUrl; t.appendChild(i); }
  }
  const openRev = () => {
    if (!lastBlob) return toast('まだ撮影していません');
    const m = $('#revMedia'); m.innerHTML = '';
    if (lastBlob.type.startsWith('video')) { const v = document.createElement('video'); v.src = thumbUrl; v.controls = true; v.playsInline = true; m.appendChild(v); }
    else { const i = document.createElement('img'); i.src = thumbUrl; m.appendChild(i); }
    $('#rev').classList.remove('hidden');
  };
  $('#thumb').addEventListener('click', openRev); $('#thumb2').addEventListener('click', openRev);
  $('#revClose').addEventListener('click', () => { $('#rev').classList.add('hidden'); $('#revMedia').innerHTML = ''; });
  $('#revSave').addEventListener('click', async () => {
    if (!lastBlob) return;
    const isV = lastBlob.type.startsWith('video'), ext = isV ? (lastBlob.type.includes('mp4') ? 'mp4' : 'webm') : 'jpg';
    const name = (isV ? 'VID_' : 'IMG_') + new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14) + '.' + ext;
    const file = new File([lastBlob], name, { type: lastBlob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = thumbUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove(); void 0;
  });

  // ---------- タブ ----------
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    const t = b.dataset.tab;
    $('#pdfwrap').classList.toggle('hidden', t !== 'pdf'); $('#urlwrap').classList.toggle('hidden', t !== 'url'); $('#mapwrap').classList.toggle('hidden', t !== 'map');
    $('#pickPdf2').classList.toggle('hidden', t !== 'pdf');
    try { localStorage.setItem('tab', t); } catch {}
  }));
  try { const t = localStorage.getItem('tab'); if (t) document.querySelector(`.tabs button[data-tab="${t}"]`)?.click(); } catch {}

  // ---------- PDF ----------
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('safaricam', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const kvSet = async (k, v) => { try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch {} };
  const kvGet = async k => { try { const db = await idb(); return await new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); } catch { return undefined; } };
  async function renderPdf(buf) {
    const wrap = $('#pdfwrap'); wrap.querySelectorAll('canvas').forEach(c => c.remove()); $('#pdfEmpty').classList.add('hidden');
    const doc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
    const cssW = (wrap.clientWidth || window.innerWidth) - 16, dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p), vp0 = page.getViewport({ scale: 1 }), scale = cssW / vp0.width, vp = page.getViewport({ scale: scale * dpr });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.height = (vp.height / dpr) + 'px'; wrap.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }
  const pick = () => $('#pdfFile').click();
  $('#pickPdf').addEventListener('click', pick); $('#pickPdf2').addEventListener('click', pick);
  $('#pdfFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    const buf = await f.arrayBuffer(); await kvSet('pdf', buf);
    try { await renderPdf(buf); void 0; } catch (err) { toast('PDFを開けません: ' + err.message); }
    e.target.value = '';
  });
  kvGet('pdf').then(buf => { if (buf) renderPdf(buf).catch(() => {}); });

  // ---------- URL ----------
  const loadUrl = () => {
    let u = $('#urlIn').value.trim(); if (!u) return;
    const isUrl = /^https?:\/\//i.test(u) || (/^[^\s]+\.[^\s]{2,}/.test(u) && !/\s/.test(u));
    if (!isUrl) u = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(u);
    else if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    $('#frame').src = u;
    try { localStorage.setItem('url', u); } catch {}
  };
  $('#urlGo').addEventListener('click', loadUrl);
  $('#urlIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadUrl(); $('#urlIn').blur(); } });
  try { const u = localStorage.getItem('url'); if (u) { $('#urlIn').value = u; $('#frame').src = u; } } catch {}

  // ---------- 地図 ----------
  const mapQuery = raw => {
    let q = raw.trim();
    try {
      if (/^https?:\/\//i.test(q)) {
        const u = new URL(q);
        if (u.searchParams.get('q')) q = u.searchParams.get('q');
        else if (u.searchParams.get('query')) q = u.searchParams.get('query');
        else { const m = u.pathname.match(/\/place\/([^/]+)/); if (m) q = decodeURIComponent(m[1].replace(/\+/g, ' ')); else { const c = u.pathname.match(/@(-?[\d.]+),(-?[\d.]+)/); if (c) q = c[1] + ',' + c[2]; } }
      }
    } catch {}
    return q;
  };
  const loadMap = () => {
    const raw = $('#mapIn').value; if (!raw.trim()) return;
    const q = mapQuery(raw);
    if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(raw) && q === raw.trim()) return toast('短縮リンクは開けません。店名や住所を入力してください', 3200);
    $('#map').src = 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&z=17&output=embed';
    try { localStorage.setItem('map', raw); } catch {}
  };
  $('#mapGo').addEventListener('click', loadMap);
  $('#mapIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadMap(); $('#mapIn').blur(); } });
  try { const m = localStorage.getItem('map'); if (m) { $('#mapIn').value = m; loadMap(); } } catch {}

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
