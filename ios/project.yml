name: SafariCam
options:
  bundleIdPrefix: com.v
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  SafariCam:
    type: application
    platform: iOS
    sources: [SafariCam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.v.safaricam
        PRODUCT_NAME: Safari cam
        INFOPLIST_FILE: SafariCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
